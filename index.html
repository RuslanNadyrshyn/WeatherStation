<!doctype html>
<html>

<head>
	<meta charset="utf-8"> <!-- Підключення кирилиці -->
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" href="public/css/styles.css"> <!-- Підключення таблиці стилей-->
	<link rel="icon" type="image/png" href="public/img/pressure.png" />
	<title>Home MeteoStation</title>
</head>

<body> <!-- Блок відображення сторінки -->
	<header>
		<h1>Домашня метеостанція</h1>
	</header>

	<main>
		<section id="led-control">
			<h2>Яскравість LED</h2>
			<input type="range" id="ledSlider" onchange="updateSlider()" min="0" max="255" value="128" class="slider">
		</section>

		<section id="current-data">
			<div class="card">
				<span class="icon">🌡️</span>
				<div class="value" id="temp"></div>
			</div>
			<div class="card">
				<span class="icon">💧</span>
				<div class="value" id="hum"></div>
			</div>
			<div class="card">
				<span class="icon">🌪️</span>
				<div class="value" id="press"></div>
			</div>
			<div id="post"></div>
		</section>

		<div id="last-update">
			Оновлено: <span id="time-current">12:12:12 23.04.2020</span>
		  </div>

		<div class="button-wrapper">
			<button id="toggle-history">Показати історію 🔽</button>
		</div>

		<!-- TODO: update table structure -->
		<section id="history-section">
			<div class="controls">
				<label for="rowsPerPage">Показувати:</label>
				<select id="rowsPerPage">
					<option value="20">20</option>
					<option value="50">50</option>
					<option value="100">100</option>
					<option value="200">200</option>
					<option value="500">500</option>
					<option value="1000">1000</option>
				</select>
			</div>


			<div class="table-wrapper">
				<table id="data-table">
					<thead>
						<tr>
							<th data-column="date">Час</th>
							<th data-column="temp">Температура (°C)</th>
							<th data-column="hum">Вологість (%)</th>
							<th data-column="press">Тиск (hPa)</th>
						</tr>
					</thead>
					<tbody id="data-table-body">
					</tbody>
				</table>
			</div>

			<div class="pagination" id="pagination"></div>
			<div class="record-count" id="recordCount"></div>

			<div id="chart-wrapper">
				<canvas id="history-chart"></canvas>
			</div>

		</section>
	</main>
	<div class="container" style="display: none;">
		<h1 id="charts">Графіки</h1>
		<label class="chart-note">*Натисніть на графік для його збільшення</label>
		<div class="chart-block">
			<div class="chart-container" onclick="toggleChart({id})" id="container-temp">
				<label class="chart-label">Температура</label>
				<canvas id="chart-temp"></canvas>
			</div>
			<div class="chart-container" onclick="toggleChart({id})" id="container-press">
				<label class="chart-label">Тиск</label>
				<canvas id="chart-press"></canvas>
			</div>
			<div class="chart-container" onclick="toggleChart({id})" id="container-hum">
				<label class="chart-label">Вологість</label>
				<canvas id="chart-hum"></canvas>
			</div>
		</div>
	</div>

	<script src="config/config.js"></script>
	<script src="public/js/request.js"></script>
	<script src="public/js/script.js"></script> <!-- Підключення додаткових бібліотек -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
	<script src="https://code.jquery.com/jquery-3.6.1.js"></script>

</body>

</html>

<!-- Поле script -->
<script>
	localStorage.setItem("ServerError", "");              // Очищення повідомлення про помилку 
	$(document).ready(function () {                   // Виконання після того, як сторінка завантажить усі залежності
		var items = getItems();                      // Виклик функції, яка повертає параметри з локального сховища браузера
		getSlider();
		getCurrentData();                        // Виклик функції динамічного оновлення інформації в таблиці "Дані датчика BME280"
		renderTable();                            // Виклик функції оновлення даних таблиці База даних
	});
</script>
